<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Secret Pixel - Steganography Tool</title>
    <style>
        :root { --bg: #050505; --neon: #00ff41; --card: #111; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .box { background: var(--card); border: 1px solid var(--neon); padding: 25px; border-radius: 5px; box-shadow: 0 0 15px rgba(0,255,65,0.2); max-width: 600px; width: 100%; }
        h2 { text-align: center; text-transform: uppercase; letter-spacing: 5px; }
        canvas { display: none; }
        #preview { max-width: 100%; margin: 15px 0; border: 1px dashed var(--neon); }
        textarea { width: 100%; background: #000; color: var(--neon); border: 1px solid var(--neon); padding: 10px; box-sizing: border-box; margin: 10px 0; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; background: var(--neon); color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 20px var(--neon); }
    </style>
</head>
<body>

<div class="box">
    <h2>☣️ Secret Pixel</h2>
    <p style="font-size: 12px; text-align: center;">Rasm ichiga maxfiy xabar yashiring!</p>
    
    <input type="file" id="upload" accept="image/*" style="margin-bottom: 15px;">
    <img id="preview" alt="Rasm yuklang...">
    
    <textarea id="secretMsg" rows="3" placeholder="Yashirin xabarni yozing..."></textarea>
    
    <div class="btn-group">
        <button onclick="encode()">YASHIRISH 🔒</button>
        <button onclick="decode()" style="background: #000; color: var(--neon); border: 1px solid var(--neon);">O'QISH 🔓</button>
    </div>
    <canvas id="canvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const upload = document.getElementById('upload');
    const preview = document.getElementById('preview');

    upload.onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                preview.src = canvas.toDataURL();
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    function encode() {
        const msg = document.getElementById('secretMsg').value + "##END##";
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = imgData.data;

        for (let i = 0; i < msg.length; i++) {
            pixels[i * 4] = msg.charCodeAt(i); // Har bir belgini piksellarning Red kanaliga yashiramiz
        }

        ctx.putImageData(imgData, 0, 0);
        const link = document.createElement('a');
        link.download = 'secret-image.png';
        link.href = canvas.toDataURL();
        link.click();
        alert("Xabar rasmga yashirildi va yuklab olindi!");
    }

    function decode() {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const pixels = imgData.data;
        let decodedMsg = "";

        for (let i = 0; i < pixels.length; i += 4) {
            const char = String.fromCharCode(pixels[i]);
            decodedMsg += char;
            if (decodedMsg.includes("##END##")) break;
        }

        document.getElementById('secretMsg').value = decodedMsg.replace("##END##", "");
        alert("Xabar rasm ichidan topildi!");
    }
</script>

</body>
</html>
